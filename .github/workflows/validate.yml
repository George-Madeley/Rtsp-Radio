name: Validate

on:
  pull_request:
    branches:
      - develop
      - release

jobs:
  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "16" # Use the Node.js version compatible with your project

      # Step 3: Install dependencies
      - name: Install Dependencies
        run: npm install

      # Step 4: Run clang-format check
      - name: Run Clang Format Check
        run: |
          npx clang-format -i --style=file **/*.{c,cpp,h,hpp}
          git diff --exit-code

      # Step 5: Install clang-tidy
      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy

      # Step 6: Run clang-tidy check
      - name: Run Clang-Tidy Check
        run: |
          clang-tidy **/*.{c,cpp,h,hpp} -- -std=c++17
